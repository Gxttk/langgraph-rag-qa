# ============================================================
# 一键部署：Milvus 向量库（etcd + minio + standalone）+ RAG 应用 app
# 用法（全新环境）：
#   1. cp .env.example .env，填入你自己的 DEEPSEEK / DASHSCOPE Key
#   2. docker compose up -d standalone            # 先起向量库
#   3. docker compose run --rm app python run.py --ingest   # 文档一次性入库
#   4. docker compose up -d app                   # 起问答服务，访问 http://localhost:8000/docs
# 说明：若本机已有 Milvus 占用 19530（如其他项目共用），可只起 app 并把
#       MILVUS_HOST 指向已有实例，无需重复启动下面三个基础服务。
# ============================================================
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:latest
    container_name: rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO 控制台（浏览器访问）
    volumes:
      - minio_data:/minio_data

  standalone:
    image: milvusdb/milvus:v2.6.12
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # Milvus SDK 连接端口
      - "9091:9091"     # 健康检查 / metrics
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - milvus_data:/var/lib/milvus

  # 问答应用服务
  app:
    build: .
    image: langgraph-rag-qa
    container_name: rag-app
    depends_on:
      standalone:
        condition: service_healthy   # 等 Milvus 真正可连才启动，避免启动期连接失败
    env_file:
      - .env                          # 运行时注入 LLM / Embedding Key，密钥不进镜像
    environment:
      # 容器网络内通过服务名 standalone 连 Milvus（不能写 localhost）；
      # 这里会覆盖 .env 中面向本机的 MILVUS_HOST=localhost
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro           # 挂载知识库文档，更新文档无需重建镜像

volumes:
  etcd_data:
  minio_data:
  milvus_data:
